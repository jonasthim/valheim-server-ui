name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run gen:api
      - run: git diff --exit-code -- src/api/schema.d.ts || (echo "run make gen and commit schema.d.ts" && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: CGO_ENABLED=0 go build -o bin/valheim-ui ./cmd/valheim-ui
      - run: cd web && npx playwright test --config ../e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/test-results }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - run: make build-go VERSION=${{ github.ref_name }} COMMIT=${{ github.sha }}
      - run: mkdir -p dist && tar -czf dist/valheim-ui_linux_amd64.tar.gz -C bin valheim-ui && tar -czf dist/deploy.tar.gz deploy
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/valheim-ui_linux_amd64.tar.gz
            dist/deploy.tar.gz
