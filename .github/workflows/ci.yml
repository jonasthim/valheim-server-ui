name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish from this ref, e.g. v1.0.0 (creates the tag and the GitHub release)"
        required: true
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: make deploy-sync-check

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run gen:api
      - run: git diff --exit-code -- src/api/schema.d.ts || (echo "run make gen and commit schema.d.ts" && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - name: Install Playwright Chromium
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npx playwright install chromium
          # OS libraries for Chromium. This runs apt-get update, which fails when an
          # unrelated third-party apt source on the runner image (Google Chrome's,
          # Microsoft's) serves a stale index; drop those sources and retry once.
          npx playwright install-deps chromium || {
            sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/microsoft*.list
            sudo apt-get update -qq
            npx playwright install-deps chromium
          }
      - run: CGO_ENABLED=0 go build -o bin/valheim-ui ./cmd/valheim-ui
      - run: cd web && npx playwright test --config e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/e2e/test-results }

  # Decides whether this run publishes a release and under which tag:
  #   - a pushed v* tag releases that tag;
  #   - workflow_dispatch releases the given version from the chosen ref;
  #   - a push to main releases "v$(cat VERSION)" when that tag does not exist yet,
  #     so bumping the VERSION file on main is the normal way to cut a release.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
      create_tag: ${{ steps.decide.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag=""
          publish=false
          create_tag=false
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"; publish=true
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            tag="$INPUT_VERSION"; publish=true
          elif [[ "$EVENT" == push && "$REF" == refs/heads/main && -f VERSION ]]; then
            tag="v$(tr -d '[:space:]' < VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "tag $tag already exists; nothing to release"
            else
              publish=true; create_tag=true
            fi
          fi
          if [[ "$publish" == true ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "version must look like v1.2.3, got '$tag'"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish tag=$tag create_tag=$create_tag"

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - run: make build-go VERSION=$RELEASE_TAG COMMIT=${{ github.sha }}
      - run: make deploy-sync-check
      - run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/valheim-ui_linux_amd64.tar.gz -C bin valheim-ui
          tar -czf dist/deploy.tar.gz deploy
          cp deploy/install.sh dist/install.sh
          ( cd dist && sha256sum valheim-ui_linux_amd64.tar.gz deploy.tar.gz install.sh > SHA256SUMS )
          cat dist/SHA256SUMS
      # Keep the built assets as a workflow artifact too, so a failed publish
      # (e.g. the token lacking release permissions) never loses the build.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/
          retention-days: 30
      # VERSION-file releases: create the tag with a plain git push (the checkout
      # token can do that with contents: write). A tag pushed with GITHUB_TOKEN
      # does not start another workflow run, so nothing releases twice.
      - name: Create tag from VERSION
        if: needs.version.outputs.create_tag == 'true'
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
      # The tag exists by now in every path, so no target_commitish is passed:
      # the release API has been seen to answer 403 to GITHUB_TOKEN when one is.
      - uses: softprops/action-gh-release@v2
        with:
          # RELEASE_TOKEN (optional repository secret: a fine-grained PAT with
          # contents:write) takes over when the workflow token may not create releases.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Install or upgrade with one command:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/jonasthim/valheim-server-ui/main/deploy/install.sh | sudo bash
            ```

            Running instances upgrade from the dashboard (Settings → Application → Upgrade).
            Assets: `valheim-ui_linux_amd64.tar.gz` (binary), `install.sh`, `deploy.tar.gz`, `SHA256SUMS`.
          files: |
            dist/valheim-ui_linux_amd64.tar.gz
            dist/deploy.tar.gz
            dist/install.sh
            dist/SHA256SUMS
