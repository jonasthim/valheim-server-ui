name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish from this ref, e.g. v1.0.0 (creates the tag and the GitHub release)"
        required: true
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: make deploy-sync-check

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run gen:api
      - run: git diff --exit-code -- src/api/schema.d.ts || (echo "run make gen and commit schema.d.ts" && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: CGO_ENABLED=0 go build -o bin/valheim-ui ./cmd/valheim-ui
      - run: cd web && npx playwright test --config e2e/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/e2e/test-results }

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version input
        if: github.event_name == 'workflow_dispatch'
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "version must look like v1.2.3"; exit 1; }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - run: make build-go VERSION=$RELEASE_TAG COMMIT=${{ github.sha }}
      - run: make deploy-sync-check
      - run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/valheim-ui_linux_amd64.tar.gz -C bin valheim-ui
          tar -czf dist/deploy.tar.gz deploy
          cp deploy/install.sh dist/install.sh
          ( cd dist && sha256sum valheim-ui_linux_amd64.tar.gz deploy.tar.gz install.sh > SHA256SUMS )
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Install or upgrade with one command:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/jonasthim/valheim-server-ui/main/deploy/install.sh | sudo bash
            ```

            Running instances upgrade from the dashboard (Settings → Application → Upgrade).
            Assets: `valheim-ui_linux_amd64.tar.gz` (binary), `install.sh`, `deploy.tar.gz`, `SHA256SUMS`.
          files: |
            dist/valheim-ui_linux_amd64.tar.gz
            dist/deploy.tar.gz
            dist/install.sh
            dist/SHA256SUMS
